[package]
name = "ferry-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
bincode = "1"
directories = "6.0.0"
ferry-net = { version = "0.1.0", path = "../net" }
ferry-proto = { path = "../proto" }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.10"
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v4"] }
