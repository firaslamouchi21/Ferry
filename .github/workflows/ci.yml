name: CI

on:
  push:
    branches: [main,sandbox]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Supply chain, lint, bindings, tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny check
        run: cargo deny check

      - name: cargo audit
        run: cargo audit

      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked

      - name: cargo clippy --workspace --all-targets --locked
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Regenerate ts-rs bindings and fail on diff
        run: |
          cargo test --package ferry-proto --locked
          git diff --exit-code -- bindings/
          if [ -n "$(git ls-files --others --exclude-standard -- bindings/)" ]; then
            echo "untracked generated binding files — run 'cargo test -p ferry-proto' then 'git add bindings/'"
            git status --porcelain -- bindings/
            exit 1
          fi

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  frontend:
    name: UI + extension (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate bindings for the UI typecheck
        run: cargo test --package ferry-proto --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ferry/ui typecheck
      - name: Unit + screen tests (vitest + jsdom)
        run: pnpm --filter @ferry/ui test
      - run: pnpm --filter @ferry/ui build
      - name: Build + package the VS Code extension (.vsix)
        run: pnpm --filter ferry-vscode package
      - name: Extension activation smoke — activate() registers every command + the tree view without throwing
        run: pnpm --filter ferry-vscode run test:activation
      - name: Install xvfb for the extension-host test
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Extension host test — real VS Code activates the extension, opens the webview, runs commands
        run: xvfb-run -a pnpm --filter ferry-vscode run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: ferry-vsix-dev
          path: ext/vscode/ferry.vsix
          if-no-files-found: error

  macos:
    name: Build & test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
      - name: Keychain smoke — the OS-native store actually round-trips a secret
        run: |
          security create-keychain -p ci-pass ferry-ci.keychain
          security list-keychains -d user -s ferry-ci.keychain "$(security default-keychain -d user | tr -d ' "')"
          security default-keychain -s ferry-ci.keychain
          security unlock-keychain -p ci-pass ferry-ci.keychain
          security set-keychain-settings ferry-ci.keychain
          cargo test -p ferry-crypto --locked -- --ignored --exact secret_store::tests::keychain_backend_smoke_generate_read_clear
      - name: Tear down the throwaway keychain
        if: always()
        run: security delete-keychain ferry-ci.keychain || true

  windows:
    name: Build & test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
      - name: Keychain smoke — the Windows credential store actually round-trips a secret
        run: cargo test -p ferry-crypto --locked -- --ignored --exact secret_store::tests::keychain_backend_smoke_generate_read_clear

  desktop:
    name: Tauri shell compiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate bindings for the desktop typecheck
        run: cargo test --package ferry-proto --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ferry/desktop build
      - name: cargo check the Tauri crate (its own workspace, so the root build never sees it)
        working-directory: desktop/src-tauri
        run: cargo check --locked
      - name: cargo test the Tauri crate (framing + socket-path + daemon-resolution)
        working-directory: desktop/src-tauri
        run: cargo test --locked

  docker-two-peer:
    name: Two-peer end-to-end scenario (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the scripted pair + send + open scenario across two containers
        run: bash testing/scenario.sh

  host-two-peer:
    name: Two-peer end-to-end scenario (host processes, no docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install dbus + gnome-keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0
      - name: cargo build -p ferry-daemon -p ferry-cli --locked
        run: cargo build -p ferry-daemon -p ferry-cli --locked
      - name: Run two real daemons with isolated keychains through pair + send + open
        run: bash testing/local-two-peer.sh
      - name: Invariant suite — roster enforcement, burn, TTL-from-delivery, offline drain, content-free audit
        run: bash testing/verify-invariants.sh

  two-peer-strict:
    name: Two-peer full invariant suite over real multicast (hard failure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pair + transfer + burn + TTL + messaging + content-free audit, across two real containers
        run: FERRY_COMPOSE=docker-compose.macvlan.yml FERRY_STRICT=1 FERRY_MCAST_BRIDGE=ferrymcast0 bash testing/scenario.sh
