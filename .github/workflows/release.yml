name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, name: macos-aarch64, target: aarch64-apple-darwin }
          - { os: macos-13, name: macos-x86_64, target: x86_64-apple-darwin }
          - { os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p ferry-daemon -p ferry

      - name: Smoke-run the freshly built binaries
        shell: bash
        run: |
          ext=""
          [ "${{ matrix.os }}" = "windows-latest" ] && ext=".exe"
          "target/${{ matrix.target }}/release/ferry-daemon$ext" --version
          "target/${{ matrix.target }}/release/ferry-daemon$ext" --help | head -1
          "target/${{ matrix.target }}/release/ferry$ext" --version
          "target/${{ matrix.target }}/release/ferry$ext" --help | head -1

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [ "${{ matrix.os }}" = "windows-latest" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/ferry-daemon$ext" "dist/ferry-daemon-${{ matrix.name }}$ext"
          cp "target/${{ matrix.target }}/release/ferry$ext" "dist/ferry-${{ matrix.name }}$ext"

      - name: Sign macOS binaries
        if: startsWith(matrix.os, 'macos')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: bash .github/scripts/sign-macos.sh dist

      - name: Sign Windows binaries
        if: matrix.os == 'windows-latest'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: pwsh .github/scripts/sign-windows.ps1 dist

      - name: Sign Linux binaries
        if: matrix.os == 'ubuntu-latest'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash .github/scripts/sign-linux.sh dist

      - name: Checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum ferry* > "SHA256SUMS-${{ matrix.name }}.txt"; else shasum -a 256 ferry* > "SHA256SUMS-${{ matrix.name }}.txt"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ferry-${{ matrix.name }}
          path: dist/*

  vsix:
    name: package .vsix (${{ matrix.vsce_target }})
    needs: binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vsce_target: linux-x64, daemon_artifact: ferry-linux-x86_64, daemon_file: ferry-daemon-linux-x86_64 }
          - { vsce_target: darwin-arm64, daemon_artifact: ferry-macos-aarch64, daemon_file: ferry-daemon-macos-aarch64 }
          - { vsce_target: darwin-x64, daemon_artifact: ferry-macos-x86_64, daemon_file: ferry-daemon-macos-x86_64 }
          - { vsce_target: win32-x64, daemon_artifact: ferry-windows-x86_64, daemon_file: ferry-daemon-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate bindings for the UI build
        run: cargo test --package ferry-proto --locked
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.daemon_artifact }}
          path: daemon-bin
      - name: Package the platform .vsix with its daemon bundled
        run: >
          node scripts/package.mjs
          --target ${{ matrix.vsce_target }}
          --daemon "$GITHUB_WORKSPACE/daemon-bin/${{ matrix.daemon_file }}"
          --out "ferry-${{ matrix.vsce_target }}.vsix"
        working-directory: ext/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: ferry-vsix-${{ matrix.vsce_target }}
          path: ext/vscode/ferry-${{ matrix.vsce_target }}.vsix

  publish-extension:
    name: publish .vsix to the marketplaces
    needs: vsix
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: ext/vscode
      - uses: actions/download-artifact@v4
        with:
          pattern: ferry-vsix-*
          path: vsix
          merge-multiple: true
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: ext/vscode
        run: pnpm exec vsce publish --no-dependencies --packagePath $(ls ../../vsix/*.vsix)
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: ext/vscode
        run: |
          for f in ../../vsix/*.vsix; do pnpm exec ovsx publish "$f" -p "$OVSX_PAT" || true; done
      - name: Note when publishing was skipped
        if: env.VSCE_PAT == '' && env.OVSX_PAT == ''
        run: echo "Neither VSCE_PAT nor OVSX_PAT is set — see docs/VSCODE_MARKETPLACE_SETUP.md. Skipping marketplace publish; the .vsix files are still attached to the GitHub Release."

  release:
    name: publish GitHub Release
    needs: [binaries, vsix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble the release directory
        run: |
          mkdir release
          find artifacts -type f ! -name 'SHA256SUMS-*' -exec cp {} release/ \;
          cat artifacts/*/SHA256SUMS-*.txt > release/SHA256SUMS.txt
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
