name: Security audit

# Daily schedule and automatic runs are disabled. Run manually from the Actions tab if needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check advisories bans sources licenses
        run: cargo deny check
