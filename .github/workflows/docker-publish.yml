name: Docker publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test the image build
        run: docker build -f docker/Dockerfile -t ferry:ci .

      - name: Run the built image against a real request
        run: |
          docker run -d --name ferry-smoke -p 15170:5170 -e FERRY_IDENTITY_PASSPHRASE=ci-smoke-test ferry:ci
          timeout 30 bash -c 'until curl -sf http://localhost:15170/ >/dev/null; do sleep 1; done'
          docker exec ferry-smoke ferry status
          docker stop ferry-smoke

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="ghcr.io/${{ github.repository }}:${version},ghcr.io/${{ github.repository }}:latest"
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            tags="$tags,${{ vars.DOCKERHUB_USERNAME }}/ferry:${version},${{ vars.DOCKERHUB_USERNAME }}/ferry:latest"
          fi
          echo "tags=$tags" >>"$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
