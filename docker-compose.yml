name: ferry

services:
  ferry:
    image: ${FERRY_IMAGE:-ghcr.io/firaslamouchi21/ferry:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${FERRY_UI_PORT:-5170}:5170"
      - "${FERRY_P2P_PORT:-47821}:47821/tcp"
      - "${FERRY_P2P_PORT:-47821}:47821/udp"
    environment:
      FERRY_IDENTITY_PASSPHRASE: ${FERRY_IDENTITY_PASSPHRASE:?set FERRY_IDENTITY_PASSPHRASE in your environment or a .env file}
    volumes:
      - ferry-data:/data
    restart: unless-stopped

volumes:
  ferry-data:
